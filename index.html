<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weight Price Calculator</title>

  <style>

    :root{
      --main-color:#c62828;
      --dark-color:#9f1d1d;
      --bg-color:#f2f2f2;
    }

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:var(--bg-color);
    }

    .header{
      background:var(--main-color);
      color:white;
      text-align:center;
      padding:20px;
      border-bottom-left-radius:20px;
      border-bottom-right-radius:20px;
      box-shadow:0 4px 10px rgba(0,0,0,0.2);
    }

    .header h1{
      font-size:30px;
      letter-spacing:1px;
    }

    .container{
      width:90%;
      max-width:430px;
      margin:30px auto;
      background:white;
      padding:25px;
      border-radius:20px;
      box-shadow:0 5px 15px rgba(0,0,0,0.1);
    }

    .mode-box{
      display:flex;
      gap:10px;
      margin-bottom:25px;
    }

    .mode-btn{
      flex:1;
      padding:14px;
      border:none;
      border-radius:12px;
      background:#e0e0e0;
      font-size:15px;
      font-weight:bold;
      cursor:pointer;
      transition:0.3s;
    }

    .active{
      background:var(--main-color);
      color:white;
    }

    .input-group{
      margin-bottom:22px;
    }

    .input-group label{
      display:block;
      margin-bottom:8px;
      font-size:15px;
      font-weight:bold;
      color:#444;
      line-height:22px;
    }

    .input-flex{
      display:flex;
      gap:10px;
      align-items:center;
    }

    .input-flex input{
      flex:2;
    }

    .input-flex select{
      flex:1;
    }

    .input-group input,
    .input-group select{
      width:100%;
      padding:14px;
      border:none;
      border-bottom:3px solid var(--main-color);
      background:#fafafa;
      outline:none;
      font-size:16px;
      border-radius:10px 10px 0 0;
    }

    .btn-group{
      display:flex;
      gap:10px;
      margin-top:25px;
    }

    .btn{
      flex:1;
      padding:15px;
      border:none;
      border-radius:50px;
      font-size:17px;
      font-weight:bold;
      cursor:pointer;
      transition:0.3s;
      color:white;
    }

    .calculate-btn{
      background:var(--main-color);
    }

    .calculate-btn:hover{
      background:var(--dark-color);
    }

    .reset-btn{
      background:#555;
    }

    .reset-btn:hover{
      background:#333;
    }

    .result{
      margin-top:25px;
      background:white;
      padding:22px;
      border-radius:15px;
      text-align:center;
      font-size:22px;
      font-weight:bold;
      border:3px solid var(--main-color);

      box-shadow:
        0 0 10px rgba(198,40,40,0.4),
        0 0 20px rgba(198,40,40,0.3);

      display:none;

      white-space:nowrap;
    }

    .footer{
      margin-top:30px;
      text-align:center;
    }

    .footer span{
      display:inline-block;
      background:black;
      color:white;
      padding:12px 24px;
      border-radius:12px;
      font-size:17px;
      font-weight:bold;
      letter-spacing:2px;

      box-shadow:
        0 0 10px rgba(0,0,0,0.4),
        0 0 20px rgba(0,0,0,0.2);
    }

    @media(max-width:500px){

      .input-flex{
        flex-direction:column;
      }

      .btn-group{
        flex-direction:column;
      }

      .header h1{
        font-size:24px;
      }

      .footer span{
        font-size:14px;
      }

      .result{
        font-size:18px;
        white-space:normal;
      }
    }

  </style>
</head>

<body>

  <div class="header">
    <h1>⚖️ WEIGHT ↔ PRICE 💰</h1>
  </div>

  <div class="container">

    <div class="mode-box">

      <button
        class="mode-btn active"
        id="weightBtn"
      >
        Weight → Price
      </button>

      <button
        class="mode-btn"
        id="priceBtn"
      >
        Price → Weight
      </button>

    </div>

    <div class="input-group">

      <label>
        Enter Quantity For
      </label>

      <div class="input-flex">

        <input
          type="number"
          id="priceForValue"
          value="1"
        >

        <select id="priceForUnit">

          <option value="kg">
            Kg
          </option>

          <option value="gram">
            Gram
          </option>

        </select>

      </div>

    </div>

    <div class="input-group">

      <label>
        Enter Price
      </label>

      <div class="input-flex">

        <input
          type="number"
          id="priceInput"
        >

      </div>

    </div>

    <div class="input-group">

      <label id="weightLabel">
        Enter Weight In Gram Or Kg To Calculate Price
      </label>

      <div class="input-flex">

        <input
          type="number"
          id="weightInput"
        >

        <select id="weightUnit">

          <option value="gram">
            Gram
          </option>

          <option value="kg">
            Kg
          </option>

        </select>

      </div>

    </div>

    <div class="btn-group">

      <button
        class="btn calculate-btn"
        onclick="calculate()"
      >
        Calculate
      </button>

      <button
        class="btn reset-btn"
        onclick="resetFields()"
      >
        Reset
      </button>

    </div>

    <div
      class="result"
      id="resultBox"
    ></div>

    <div class="footer">
      <span>DESIGN BY SHUBHAM</span>
    </div>

  </div>

  <script>

    let mode = "weightToPrice";

    const weightBtn =
      document.getElementById("weightBtn");

    const priceBtn =
      document.getElementById("priceBtn");

    const weightLabel =
      document.getElementById("weightLabel");

    weightBtn.addEventListener("click", () => {

      mode = "weightToPrice";

      weightBtn.classList.add("active");

      priceBtn.classList.remove("active");

      weightLabel.innerText =
        "Enter Weight In Gram Or Kg To Calculate Price";

      resetFields();
    });

    priceBtn.addEventListener("click", () => {

      mode = "priceToWeight";

      priceBtn.classList.add("active");

      weightBtn.classList.remove("active");

      weightLabel.innerText =
        "Enter Price To Calculate Weight";

      resetFields();
    });

    function calculate(){

      let quantityValue =
        parseFloat(
          document.getElementById("priceForValue").value
        );

      let priceInput =
        parseFloat(
          document.getElementById("priceInput").value
        );

      let weightInput =
        parseFloat(
          document.getElementById("weightInput").value
        );

      const quantityUnit =
        document.getElementById("priceForUnit").value;

      const weightUnit =
        document.getElementById("weightUnit").value;

      const resultBox =
        document.getElementById("resultBox");

      if(
        isNaN(quantityValue) ||
        isNaN(priceInput) ||
        isNaN(weightInput)
      ){

        resultBox.style.display = "block";

        resultBox.innerHTML =
          "Please enter all values";

        return;
      }

      let totalGram = 0;

      if(quantityUnit === "kg"){

        totalGram = quantityValue * 1000;

      }else{

        totalGram = quantityValue;
      }

      let pricePerGram =
        priceInput / totalGram;

      /* WEIGHT TO PRICE */

      if(mode === "weightToPrice"){

        let finalWeight = 0;
        let displayWeight = "";
        let displayUnit = "";

        if(weightUnit === "kg"){

          finalWeight =
            weightInput * 1000;

          displayWeight =
            weightInput;

          displayUnit = "Kg";

        }else{

          finalWeight =
            weightInput;

          displayWeight =
            weightInput;

          displayUnit = "Gram";
        }

        let finalPrice =
          finalWeight * pricePerGram;

        resultBox.innerHTML =
          `
          <span style="color:black;">
            Price For ${displayWeight} ${displayUnit} =
          </span>

          <span style="color:#c62828;">
            ₹ ${finalPrice.toFixed(2)}
          </span>
          `;
      }

      /* PRICE TO WEIGHT */

      else{

        let finalGram =
          weightInput / pricePerGram;

        if(weightUnit === "kg"){

          finalGram =
            finalGram / 1000;

          resultBox.innerHTML =
            `
            <span style="color:black;">
              Kg =
            </span>

            <span style="color:#c62828;">
              ${finalGram.toFixed(2)}
            </span>
            `;

        }else{

          resultBox.innerHTML =
            `
            <span style="color:black;">
              Gram =
            </span>

            <span style="color:#c62828;">
              ${finalGram.toFixed(2)}
            </span>
            `;
        }
      }

      resultBox.style.display = "block";
    }

    function resetFields(){

      document.getElementById("priceForValue").value = 1;

      document.getElementById("priceForUnit").value = "kg";

      document.getElementById("priceInput").value = "";

      document.getElementById("weightInput").value = "";

      document.getElementById("weightUnit").value = "gram";

      document.getElementById("resultBox").style.display =
        "none";
    }

  </script>

</body>
</html>
