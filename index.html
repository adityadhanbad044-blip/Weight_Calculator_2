<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Weight Price Calculator</title>

  <style>

    :root{
      --main-color:#c62828;
      --dark-color:#9f1d1d;
      --light-bg:#f2f2f2;
    }

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:var(--light-bg);
    }

    /* HEADER */

    .header{
      background:var(--main-color);
      color:white;
      text-align:center;
      padding:20px;
      border-bottom-left-radius:20px;
      border-bottom-right-radius:20px;
      box-shadow:0 4px 10px rgba(0,0,0,0.2);
    }

    .header h1{
      font-size:30px;
      letter-spacing:1px;
    }

    /* MAIN CARD */

    .container{
      width:90%;
      max-width:420px;
      margin:30px auto;
      background:white;
      padding:25px;
      border-radius:20px;
      box-shadow:0 5px 15px rgba(0,0,0,0.1);
    }

    /* OPTION BUTTONS */

    .mode-box{
      display:flex;
      gap:10px;
      margin-bottom:25px;
    }

    .mode-btn{
      flex:1;
      padding:14px;
      border:none;
      border-radius:12px;
      background:#e0e0e0;
      font-size:16px;
      font-weight:bold;
      cursor:pointer;
      transition:0.3s;
    }

    .active{
      background:var(--main-color);
      color:white;
    }

    /* INPUTS */

    .input-group{
      margin-bottom:20px;
    }

    .input-group label{
      display:block;
      margin-bottom:8px;
      font-weight:bold;
      color:#444;
    }

    .input-group input{
      width:100%;
      padding:14px;
      border:none;
      border-bottom:3px solid var(--main-color);
      background:#fafafa;
      outline:none;
      font-size:17px;
      border-radius:10px 10px 0 0;
    }

    /* BUTTONS */

    .btn-group{
      display:flex;
      gap:10px;
      margin-top:25px;
    }

    .btn{
      flex:1;
      padding:15px;
      border:none;
      border-radius:50px;
      font-size:17px;
      font-weight:bold;
      cursor:pointer;
      transition:0.3s;
      color:white;
    }

    .calculate-btn{
      background:var(--main-color);
    }

    .calculate-btn:hover{
      background:var(--dark-color);
    }

    .reset-btn{
      background:#666;
    }

    .reset-btn:hover{
      background:#444;
    }

    /* RESULT */

    .result{
      margin-top:25px;
      background:white;
      padding:20px;
      border-radius:15px;
      text-align:center;
      font-size:24px;
      font-weight:bold;
      color:var(--main-color);

      border:3px solid var(--main-color);

      box-shadow:
        0 0 10px rgba(198,40,40,0.4),
        0 0 20px rgba(198,40,40,0.3),
        0 0 30px rgba(198,40,40,0.2);

      display:none;

      transition:0.3s;
    }

    /* FOOTER */

    .footer{
      margin-top:30px;
      text-align:center;
    }

    .footer span{
      display:inline-block;
      background:black;
      color:white;
      padding:12px 25px;
      border-radius:12px;
      font-size:18px;
      font-weight:bold;
      letter-spacing:2px;

      box-shadow:
        0 0 10px rgba(0,0,0,0.4),
        0 0 20px rgba(0,0,0,0.3);

      transition:0.3s;
    }

    .footer span:hover{
      transform:scale(1.05);
    }

    /* MOBILE */

    @media(max-width:500px){

      .btn-group{
        flex-direction:column;
      }

      .header h1{
        font-size:24px;
      }

      .footer span{
        font-size:15px;
        padding:10px 18px;
      }
    }

  </style>
</head>

<body>

  <!-- HEADER -->

  <div class="header">
    <h1>⚖️ WEIGHT ↔ PRICE 💰</h1>
  </div>

  <!-- MAIN CARD -->

  <div class="container">

    <!-- MODE BUTTONS -->

    <div class="mode-box">

      <button
        class="mode-btn active"
        id="weightBtn"
      >
        Weight → Price
      </button>

      <button
        class="mode-btn"
        id="priceBtn"
      >
        Price → Weight
      </button>

    </div>

    <!-- PRICE PER KG -->

    <div class="input-group">

      <label>Price Per Kg</label>

      <input
        type="number"
        id="pricePerKg"
        placeholder="Enter price per kg"
      >

    </div>

    <!-- SECOND INPUT -->

    <div class="input-group">

      <label id="secondLabel">
        Weight in Grams
      </label>

      <input
        type="number"
        id="secondValue"
        placeholder="Enter weight"
      >

    </div>

    <!-- BUTTONS -->

    <div class="btn-group">

      <button
        class="btn calculate-btn"
        onclick="calculate()"
      >
        Calculate
      </button>

      <button
        class="btn reset-btn"
        onclick="resetFields()"
      >
        Reset
      </button>

    </div>

    <!-- RESULT -->

    <div
      class="result"
      id="resultBox"
    ></div>

    <!-- FOOTER -->

    <div class="footer">
      <span>DESIGN BY SHUBHAM</span>
    </div>

  </div>

  <script>

    let mode = "weightToPrice";

    const weightBtn =
      document.getElementById("weightBtn");

    const priceBtn =
      document.getElementById("priceBtn");

    const secondLabel =
      document.getElementById("secondLabel");

    const secondValue =
      document.getElementById("secondValue");

    /* WEIGHT TO PRICE */

    weightBtn.addEventListener("click", () => {

      mode = "weightToPrice";

      weightBtn.classList.add("active");

      priceBtn.classList.remove("active");

      secondLabel.innerText =
        "Weight in Grams";

      secondValue.placeholder =
        "Enter weight";

      resetFields();
    });

    /* PRICE TO WEIGHT */

    priceBtn.addEventListener("click", () => {

      mode = "priceToWeight";

      priceBtn.classList.add("active");

      weightBtn.classList.remove("active");

      secondLabel.innerText =
        "Price Amount";

      secondValue.placeholder =
        "Enter price";

      resetFields();
    });

    /* CALCULATE */

    function calculate(){

      const pricePerKg = parseFloat(
        document.getElementById("pricePerKg").value
      );

      const second = parseFloat(
        document.getElementById("secondValue").value
      );

      const resultBox =
        document.getElementById("resultBox");

      if(isNaN(pricePerKg) || isNaN(second)){

        resultBox.style.display = "block";

        resultBox.innerHTML =
          "Please enter valid values";

        return;
      }

      let result = 0;

      if(mode === "weightToPrice"){

        result =
          (pricePerKg / 1000) * second;

        resultBox.innerHTML =
          "Price = ₹ " +
          result.toFixed(2);

      }

      else{

        result =
          (second / pricePerKg) * 1000;

        resultBox.innerHTML =
          "Weight = " +
          result.toFixed(2) +
          " g";
      }

      resultBox.style.display = "block";
    }

    /* RESET */

    function resetFields(){

      document.getElementById("pricePerKg").value = "";

      document.getElementById("secondValue").value = "";

      document.getElementById("resultBox").style.display =
        "none";
    }

  </script>

</body>
</html>
